# One Mojaloop SDK scheme adapter (+ its Redis) per DFSP hosted by sdk_adapter, attached to the
# network of a running ml-core-test-harness. The harness's own SDKs (payerfsp, testfsp1, ...) are
# left alone: they serve the Testing Toolkit.
#
#   docker compose -f docker/sdk/docker-compose.yml up -d
#
# Hub -> SDK inbound (:4000)  at http://<fsp>-sdk:4000        (registered as the DFSP's endpoints)
# App -> SDK outbound (:4001) at http://localhost:4101 / 4201   (dfsp.sdkOutboundUrl)
# SDK -> app backend          at ${SDK_BACKEND_HOST}/sdk/<fsp>  (this app, port 8091)
#
# Bulk (G2P, simulator.disbursement.mode=BULK): each SDK also runs its outbound command and domain event
# handlers, which drive /bulkTransactions over the harness's Kafka (topics of its own per DFSP), and
# bulk-api-adapter (:3003) is added to the hub: ml-core-test-harness has central-ledger's bulk handlers,
# MongoDB (objstore) and the bulk Kafka topics, but not the service that receives POST /bulkTransfers.

x-sdk: &sdk
  image: mojaloop/sdk-scheme-adapter:${SDK_SCHEME_ADAPTER_VERSION:-v24.7.0}
  command: yarn start:api-svc
  user: root
  restart: unless-stopped
  networks: [mojaloop-net]

x-sdk-env: &sdk-env
  INBOUND_LISTEN_PORT: "4000"
  OUTBOUND_LISTEN_PORT: "4001"
  TEST_LISTEN_PORT: "4002"
  API_TYPE: fspiop
  # the hub services, by their names on mojaloop-net
  PEER_ENDPOINT: ml-api-adapter:3000
  ALS_ENDPOINT: account-lookup-service:4002
  QUOTES_ENDPOINT: quoting-service:3002
  TRANSFERS_ENDPOINT: ml-api-adapter:3000
  FX_QUOTES_ENDPOINT: quoting-service:3002
  FX_TRANSFERS_ENDPOINT: ml-api-adapter:3000
  RESOURCE_VERSIONS: transfers=2.0,quotes=2.0,participants=1.1,parties=2.0,transactionRequests=1.1
  ILP_VERSION: "1"
  CHECK_ILP: "true"
  ILP_SECRET: ${SDK_ILP_SECRET:-sdk-adapter-dev-ilp-secret}
  EXPIRY_SECONDS: "60"
  REQUEST_PROCESSING_TIMEOUT_SECONDS: "30"
  # sdk_adapter drives each step: PUT /transfers/{id} {acceptParty} then {acceptQuote}
  AUTO_ACCEPT_PARTY: "false"
  AUTO_ACCEPT_QUOTES: "false"
  AUTO_ACCEPT_PARTICIPANTS_PUT: "false"
  ALLOW_TRANSFER_WITHOUT_QUOTE: "false"
  # the payee answers RESERVED or COMMITTED itself (simulator.payee.transfer-state)
  RESERVE_NOTIFICATION: "false"
  REJECT_EXPIRED_QUOTE_RESPONSES: "false"
  REJECT_TRANSFERS_ON_EXPIRED_QUOTES: "false"
  REJECT_EXPIRED_TRANSFER_FULFILS: "false"
  # bulk quotes go to quoting-service, bulk transfers to bulk-api-adapter (not ml-api-adapter)
  BULK_QUOTES_ENDPOINT: quoting-service:3002
  BULK_TRANSFERS_ENDPOINT: bulk-api-adapter:3003
  USE_QUOTE_SOURCE_FSP_AS_TRANSFER_PAYEE_FSP: "false"
  # like the harness: no mTLS, no JWS, no OAuth
  INBOUND_MUTUAL_TLS_ENABLED: "false"
  OUTBOUND_MUTUAL_TLS_ENABLED: "false"
  VALIDATE_INBOUND_JWS: "false"
  VALIDATE_INBOUND_PUT_PARTIES_JWS: "false"
  JWS_SIGN: "false"
  JWS_SIGN_PUT_PARTIES: "false"
  ENABLE_OAUTH_TOKEN_ENDPOINT: "false"
  PM4ML_ENABLED: "false"
  # on in each SDK below, with its own Kafka topics: needed for /bulkTransactions
  ENABLE_FSPIOP_EVENT_HANDLER: "false"
  ENABLE_BACKEND_EVENT_HANDLER: "false"
  ENABLE_TEST_FEATURES: "false"
  LOG_INDENT: "0"

x-bulk-handler: &bulk-handler
  image: mojaloop/sdk-scheme-adapter:${SDK_SCHEME_ADAPTER_VERSION:-v24.7.0}
  user: root
  restart: unless-stopped
  networks: [mojaloop-net]

services:
  # the SDKs' bulk Kafka topics, on the harness's broker
  sdk-kafka-topics:
    image: docker.io/bitnamilegacy/kafka:${DEP_KAFKA_VERSION:-3.9.0}
    container_name: sdk-kafka-topics
    networks: [mojaloop-net]
    entrypoint: ["bash", "-c"]
    command:
      - |
        for t in topic-sdkbank-sdk-command-events topic-sdkbank-sdk-domain-events \
                 topic-sdkwallet-sdk-command-events topic-sdkwallet-sdk-domain-events; do
          kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t \
            --replication-factor 1 --partitions 1
        done

  bulk-api-adapter:
    image: mojaloop/bulk-api-adapter:${BULK_API_ADAPTER_VERSION:-v17.1.9}
    container_name: bulk-api-adapter
    command: node src/api/index.js
    restart: unless-stopped
    ports: ["3003:3003"]
    networks: [mojaloop-net]
    volumes:
      - ./event-sdk.json:/opt/app/.EVENT_SDKrc
    environment:
      LOG_LEVEL: info
      BKAPI_HOSTNAME: http://bulk-api-adapter
      BKAPI_ENDPOINT_SOURCE_URL: "http://central-ledger:3001/participants/{{fsp}}/endpoints"
      BKAPI_ENDPOINT_HEALTH_URL: http://central-ledger:3001/health
      BKAPI_MONGODB__HOST: objstore
      BKAPI_KAFKA__CONSUMER__NOTIFICATION__EVENT__config__rdkafkaConf__metadata.broker.list: kafka:29092
      BKAPI_KAFKA__PRODUCER__BULK__PREPARE__config__rdkafkaConf__metadata.broker.list: kafka:29092
      BKAPI_KAFKA__PRODUCER__BULK__FULFIL__config__rdkafkaConf__metadata.broker.list: kafka:29092
      BKAPI_KAFKA__PRODUCER__BULK__GET__config__rdkafkaConf__metadata.broker.list: kafka:29092

  sdkbank-redis:
    image: redis:6.2.4-alpine
    container_name: sdkbank-redis
    networks: [mojaloop-net]
    restart: unless-stopped

  sdkbank-sdk:
    <<: *sdk
    container_name: sdkbank-sdk
    depends_on: [sdkbank-redis]
    ports: ["4101:4001"]
    environment:
      <<: *sdk-env
      DFSP_ID: sdkbank
      CACHE_URL: redis://sdkbank-redis:6379
      BACKEND_ENDPOINT: ${SDK_BACKEND_HOST:-172.24.0.1:8091}/sdk/sdkbank
      ENABLE_BACKEND_EVENT_HANDLER: "true"
      ENABLE_FSPIOP_EVENT_HANDLER: "true"
      BACKEND_EVENT_CONSUMER_BROKER_LIST: kafka:29092
      BACKEND_EVENT_CONSUMER_GROUP_ID: sdkbank-api-svc-backend
      BACKEND_EVENT_CONSUMER_TOPICS: topic-sdkbank-sdk-domain-events
      BACKEND_EVENT_PRODUCER_BROKER_LIST: kafka:29092
      BACKEND_EVENT_PRODUCER_TOPIC: topic-sdkbank-sdk-domain-events
      FSPIOP_EVENT_CONSUMER_BROKER_LIST: kafka:29092
      FSPIOP_EVENT_CONSUMER_GROUP_ID: sdkbank-api-svc-fspiop
      FSPIOP_EVENT_CONSUMER_TOPICS: topic-sdkbank-sdk-domain-events
      FSPIOP_EVENT_PRODUCER_BROKER_LIST: kafka:29092
      FSPIOP_EVENT_PRODUCER_TOPIC: topic-sdkbank-sdk-domain-events

  sdkbank-sdk-command-handler:
    <<: *bulk-handler
    container_name: sdkbank-sdk-command-handler
    command: yarn start:command-handler
    depends_on:
      sdkbank-redis: {condition: service_started}
      sdk-kafka-topics: {condition: service_completed_successfully}
    environment:
      REDIS_CONNECTION_URL: redis://sdkbank-redis:6379
      COMMAND_EVENT_CONSUMER_BROKER_LIST: kafka:29092
      COMMAND_EVENT_CONSUMER_GROUP_ID: sdkbank-command-handler
      COMMAND_EVENT_CONSUMER_TOPICS: topic-sdkbank-sdk-command-events
      DOMAIN_EVENT_PRODUCER_BROKER_LIST: kafka:29092
      DOMAIN_EVENT_PRODUCER_TOPIC: topic-sdkbank-sdk-domain-events

  sdkbank-sdk-domain-handler:
    <<: *bulk-handler
    container_name: sdkbank-sdk-domain-handler
    command: yarn start:event-handler
    depends_on:
      sdkbank-redis: {condition: service_started}
      sdk-kafka-topics: {condition: service_completed_successfully}
    environment:
      REDIS_CONNECTION_URL: redis://sdkbank-redis:6379
      DOMAIN_EVENT_CONSUMER_BROKER_LIST: kafka:29092
      DOMAIN_EVENT_CONSUMER_GROUP_ID: sdkbank-domain-handler
      DOMAIN_EVENT_CONSUMER_TOPICS: topic-sdkbank-sdk-domain-events
      COMMAND_EVENT_PRODUCER_BROKER_LIST: kafka:29092
      COMMAND_EVENT_PRODUCER_TOPIC: topic-sdkbank-sdk-command-events

  sdkwallet-redis:
    image: redis:6.2.4-alpine
    container_name: sdkwallet-redis
    networks: [mojaloop-net]
    restart: unless-stopped

  sdkwallet-sdk:
    <<: *sdk
    container_name: sdkwallet-sdk
    depends_on: [sdkwallet-redis]
    ports: ["4201:4001"]
    environment:
      <<: *sdk-env
      DFSP_ID: sdkwallet
      CACHE_URL: redis://sdkwallet-redis:6379
      BACKEND_ENDPOINT: ${SDK_BACKEND_HOST:-172.24.0.1:8091}/sdk/sdkwallet
      ENABLE_BACKEND_EVENT_HANDLER: "true"
      ENABLE_FSPIOP_EVENT_HANDLER: "true"
      BACKEND_EVENT_CONSUMER_BROKER_LIST: kafka:29092
      BACKEND_EVENT_CONSUMER_GROUP_ID: sdkwallet-api-svc-backend
      BACKEND_EVENT_CONSUMER_TOPICS: topic-sdkwallet-sdk-domain-events
      BACKEND_EVENT_PRODUCER_BROKER_LIST: kafka:29092
      BACKEND_EVENT_PRODUCER_TOPIC: topic-sdkwallet-sdk-domain-events
      FSPIOP_EVENT_CONSUMER_BROKER_LIST: kafka:29092
      FSPIOP_EVENT_CONSUMER_GROUP_ID: sdkwallet-api-svc-fspiop
      FSPIOP_EVENT_CONSUMER_TOPICS: topic-sdkwallet-sdk-domain-events
      FSPIOP_EVENT_PRODUCER_BROKER_LIST: kafka:29092
      FSPIOP_EVENT_PRODUCER_TOPIC: topic-sdkwallet-sdk-domain-events

  sdkwallet-sdk-command-handler:
    <<: *bulk-handler
    container_name: sdkwallet-sdk-command-handler
    command: yarn start:command-handler
    depends_on:
      sdkwallet-redis: {condition: service_started}
      sdk-kafka-topics: {condition: service_completed_successfully}
    environment:
      REDIS_CONNECTION_URL: redis://sdkwallet-redis:6379
      COMMAND_EVENT_CONSUMER_BROKER_LIST: kafka:29092
      COMMAND_EVENT_CONSUMER_GROUP_ID: sdkwallet-command-handler
      COMMAND_EVENT_CONSUMER_TOPICS: topic-sdkwallet-sdk-command-events
      DOMAIN_EVENT_PRODUCER_BROKER_LIST: kafka:29092
      DOMAIN_EVENT_PRODUCER_TOPIC: topic-sdkwallet-sdk-domain-events

  sdkwallet-sdk-domain-handler:
    <<: *bulk-handler
    container_name: sdkwallet-sdk-domain-handler
    command: yarn start:event-handler
    depends_on:
      sdkwallet-redis: {condition: service_started}
      sdk-kafka-topics: {condition: service_completed_successfully}
    environment:
      REDIS_CONNECTION_URL: redis://sdkwallet-redis:6379
      DOMAIN_EVENT_CONSUMER_BROKER_LIST: kafka:29092
      DOMAIN_EVENT_CONSUMER_GROUP_ID: sdkwallet-domain-handler
      DOMAIN_EVENT_CONSUMER_TOPICS: topic-sdkwallet-sdk-domain-events
      COMMAND_EVENT_PRODUCER_BROKER_LIST: kafka:29092
      COMMAND_EVENT_PRODUCER_TOPIC: topic-sdkwallet-sdk-command-events

networks:
  mojaloop-net:
    external: true
