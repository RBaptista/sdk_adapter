# The harness's Grafana datasources, with the central-ledger database at mysql:3306 (this hub's
# container name) instead of mysql-cl:3306. Mounted over the harness's datasource.yml.
apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
- name: Prometheus
  type: prometheus
  access: proxy
  orgId: 1
  url: http://prometheus:9090
  basicAuth: false
  isDefault: true
  jsonData:
    tlsAuth: false
    tlsAuthWithCACert: false
  version: 1
  editable: true
- name: MySQL
  type: mysql
  url: mysql:3306
  user: central_ledger
  uid: e6f1763f-dc6a-4521-8254-0dbe1515b837
  jsonData:
    database: central_ledger
  secureJsonData:
    password: ${GRAFANA_CL_MYSQL_PASSWORD}
