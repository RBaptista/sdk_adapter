# Keycloak already listens on 8080 locally, dfsp_adapter on 8090
quarkus.http.port = 8091
# dev mode binds to localhost by default; the SDK containers must reach the backend API
%dev.quarkus.http.host = 0.0.0.0

quarkus.flyway.migrate-at-start = true
quarkus.hibernate-orm.schema-management.strategy = validate

quarkus.datasource.db-kind = postgresql
quarkus.datasource.db-version = 16

# dev/prod use a real PostgreSQL; tests get a throwaway Dev Services container
%dev.quarkus.datasource.username = ${DB_USERNAME:postgres}
%dev.quarkus.datasource.password = ${DB_PASSWORD}
%dev.quarkus.datasource.jdbc.url = ${DB_URL:jdbc:postgresql://localhost:5432/sdk_dfsp}
%prod.quarkus.datasource.username = ${DB_USERNAME:postgres}
%prod.quarkus.datasource.password = ${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url = ${DB_URL:jdbc:postgresql://localhost:5432/sdk_dfsp}
%test.quarkus.datasource.devservices.image-name = postgres:16-alpine

# --- Keycloak (user-facing /api) ---
quarkus.oidc.auth-server-url = ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:sdk}
quarkus.oidc.client-id = sdk-adapter
quarkus.oidc.application-type = service
quarkus.keycloak.devservices.enabled = false
%test.quarkus.oidc.tenant-enabled = false

# /api requires a Keycloak token; /sdk is called by the SDK scheme adapters and secured at network level
quarkus.http.auth.permission.api.paths = /api/*
quarkus.http.auth.permission.api.policy = authenticated
quarkus.http.auth.permission.sdk.paths = /sdk/*
quarkus.http.auth.permission.sdk.policy = permit

# --- Simulator ---
# a RESERVED transfer past its expiration gets this long before it is resolved through the SDK or expired
simulator.callback-timeout = 30S
simulator.transfer-expiry = 60S
# COMMITTED: payee credits when it fulfils; RESERVED: payee waits for the hub's PATCH, relayed by its SDK
simulator.payee.transfer-state = COMMITTED
simulator.payee.fee-percent = 0

# SDK scheme adapters: each DFSP stores its own outbound URL (POST /api/admin/dfsps, sdkOutboundUrl)
simulator.sdk.request-timeout = 60S
# SDK inbound API as the hub reaches it, the default for a DFSP created without sdkInboundUrl
simulator.sdk.inbound-url-template = ${SDK_INBOUND_URL_TEMPLATE:http://<fspId>-sdk:4000}

# Mojaloop hub services the SDK doesn't cover (defaults match ml-core-test-harness)
simulator.hub.als-url = ${HUB_ALS_URL:http://localhost:4002}
simulator.hub.admin-url = ${HUB_ADMIN_URL:http://localhost:3001}
simulator.hub.settlement-url = ${HUB_SETTLEMENT_URL:http://localhost:3007/v2}
# optional static bearer token if the hub sits behind an API gateway
# simulator.hub.bearer-token =

simulator.settlement.reconcile-every = 5m

# tests route the SDK and the hub through the in-app FakeSdkResource and FakeHubResource
%test.simulator.hub.als-url = http://localhost:8081/test-hub/als
%test.simulator.hub.admin-url = http://localhost:8081/test-hub/admin
%test.simulator.hub.settlement-url = http://localhost:8081/test-hub/settlement
%test.simulator.sdk.request-timeout = 15S
%test.simulator.settlement.reconcile-every = off
%test.quarkus.http.auth.permission.testhub.paths = /test-hub/*,/test-sdk/*
%test.quarkus.http.auth.permission.testhub.policy = permit

# G2P disbursements: each item is paid as its own transfer (the harness has no bulk-api-adapter)
simulator.disbursement.every = 2s
simulator.disbursement.parallelism = 5
simulator.disbursement.max-items = 10000
simulator.disbursement.resubmit-after = 5M
# BULK: the SDK's /bulkTransactions (needs bulk-api-adapter and the SDK's bulk handlers); INDIVIDUAL: one transfer per item
simulator.disbursement.mode = ${DISBURSEMENT_MODE:BULK}
simulator.disbursement.bulk-expiry = 1H
simulator.disbursement.bulk-timeout = 5M
%test.simulator.disbursement.every = 1s
%test.simulator.disbursement.resubmit-after = 3S
%test.simulator.disbursement.mode = INDIVIDUAL
